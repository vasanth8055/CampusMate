server:
  port: 8081

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
    include-exception: true

storage:
  local:
    upload-path: uploads/licenses

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  application:
    name: user-service

  data:
    redis:
      host: redis
      port: 6379

  datasource:
    url: jdbc:postgresql://postgres:5432/users_db?options=-c%20TimeZone=Asia/Kolkata
    username: postgres
    password: vasanth

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: imvasanth390@gmail.com
    password:

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: c2VjdXJlLWJhc2U2NC1lbmNvZGVkLWtleS1mb3ItcmlkZWxvb3AtMjU2LWJpdHMtMTIzNDU2Nzg5MA==
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html

verification:
  otp:
    ttl: 300

  registration:
    ttl: 1800