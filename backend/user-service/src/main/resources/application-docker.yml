server:
  port: 8081

  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
    include-exception: true

storage:
  local:
    upload-path: uploads/licenses

spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  application:
    name: user-service

  data:
    redis:
      url: ${REDIS_URL:redis://redis:6379}

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/users_db?options=-c%20TimeZone=Asia/Kolkata}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_SCHEMA:public}

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
      enabled: true
  health:
    mail:
      enabled: false

  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

verification:
  otp:
    ttl: 300

  registration:
    ttl: 1800