name: rideloop

services:

  postgres:
    image: postgres:17
    container_name: rideloop-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vasanth
      POSTGRES_DB: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: rideloop-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rideloop.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:8
    container_name: rideloop-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:4.1.0
    container_name: rideloop-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://localhost:9092,INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: rideloop-prometheus
    restart: unless-stopped

    ports:
      - "9090:9090"

    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    depends_on:
      kafka:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.1.1
    container_name: rideloop-grafana
    restart: unless-stopped

    ports:
      - "3000:3000"

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      - prometheus

  eureka-server:
    build:
      context: ./eureka-server

    container_name: rideloop-eureka-server
    restart: unless-stopped

    ports:
      - "8761:8761"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker

  api-gateway:
    build:
      context: ./api-gateway

    container_name: rideloop-api-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    depends_on:
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_INSTANCE_HOSTNAME: rideloop-api-gateway


  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile

    container_name: rideloop-user-service
    restart: unless-stopped

    ports:
      - "8081:8081"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_URL: jdbc:postgresql://postgres:5432/users_db?options=-c%20TimeZone=Asia/Kolkata
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: public

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

  trip-service:
    build:
      context: .
      dockerfile: ./trip-service/Dockerfile

    container_name: rideloop-trip-service
    restart: unless-stopped

    ports:
      - "8082:8082"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_URL: jdbc:postgresql://postgres:5432/trips_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: public

      JWT_SECRET: ${JWT_SECRET}

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile

    container_name: rideloop-booking-service
    restart: unless-stopped

    ports:
      - "8083:8083"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_URL: jdbc:postgresql://postgres:5432/bookings_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: public

      JWT_SECRET: ${JWT_SECRET}

  matching-service:
    build:
      context: .
      dockerfile: ./matching-service/Dockerfile

    container_name: rideloop-matching-service
    restart: unless-stopped

    ports:
      - "8084:8084"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8084/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    depends_on:
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker

  payment-service:
    build:
      context: ./payment-service

    container_name: rideloop-payment-service
    restart: unless-stopped

    ports:
      - "8085:8085"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_URL: jdbc:postgresql://postgres:5432/payments_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: public

      JWT_SECRET: ${JWT_SECRET}

  notification-service:
    build:
      context: ./notification-service

    container_name: rideloop-notification-service
    restart: unless-stopped

    ports:
      - "8086:8086"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_URL: jdbc:postgresql://postgres:5432/notifications_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: public

      JWT_SECRET: ${JWT_SECRET}

  ride-tracking-service:
    build:
      context: ./ride-tracking-service

    container_name: rideloop-ride-tracking-service
    restart: unless-stopped

    ports:
      - "8087:8087"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8087/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_URL: jdbc:postgresql://postgres:5432/tracking_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: public

      JWT_SECRET: ${JWT_SECRET}

  admin-service:
    build:
      context: .
      dockerfile: ./admin-service/Dockerfile

    container_name: rideloop-admin-service
    restart: unless-stopped

    ports:
      - "8089:8089"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8089/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: docker
      EUREKA_INSTANCE_HOSTNAME: rideloop-admin-service
      USER_SERVICE_URL: http://user-service:8081

      DB_URL: jdbc:postgresql://postgres:5432/admin_db?options=-c%20TimeZone=Asia/Kolkata
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: public

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      ADMIN_EMAIL: ${ADMIN_EMAIL:-campusmate.teamofficial@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Password@123}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Vasanth}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-}

volumes:
  postgres-data:
  grafana-data: