server:
  port: 8089

spring:
  application:
    name: admin-service

  datasource:
    url: jdbc:postgresql://localhost:5432/admin_db?options=-c%20TimeZone=Asia/Kolkata
    username: postgres
    password: vasanth

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

  instance:
    hostname: localhost
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: localhost:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

jwt:
  secret: c2VjdXJlLWJhc2U2NC1lbmNvZGVkLWtleS1mb3ItcmlkZWxvb3AtMjU2LWJpdHMtMTIzNDU2Nzg5MA==
  expiration: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html